name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify project structure
        working-directory: pager-api
        run: mvn -B -ntp -DskipTests verify

      - name: Run tests
        working-directory: pager-api
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: mvn -B -ntp test  
