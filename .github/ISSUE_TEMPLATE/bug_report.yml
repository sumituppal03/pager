name: 🐛 Bug report
description: Something is not working as documented or expected
title: "[bug]: "
labels: ["type/bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …

  - type: input
    id: version
    attributes:
      label: Git SHA (or version)
      placeholder: e.g. main@a3f9b21

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
