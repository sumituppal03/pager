#
# Pager — Spring Boot configuration
#
# Overrides live in application-<profile>.yml. For prod, we'll rely on
# environment variables set by the deployment platform.
#

spring:
  application:
    name: pager-api

  # ------------------------------------------------------------------
  # Persistence
  # ------------------------------------------------------------------
  datasource:
    url: ${PAGER_DB_URL:jdbc:postgresql://localhost:5432/pager}
    username: ${PAGER_DB_USER:pager}
    password: ${PAGER_DB_PASSWORD:pager}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  # ------------------------------------------------------------------
  # Redis
  # ------------------------------------------------------------------
  data:
    redis:
      url: ${PAGER_REDIS_URL:redis://localhost:6379}
      timeout: 10000
      connect-timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# ------------------------------------------------------------------
# Server
# ------------------------------------------------------------------
server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# ------------------------------------------------------------------
# Actuator
# ------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# ------------------------------------------------------------------
# Pager domain config — env-overridable, read via @ConfigurationProperties
# ------------------------------------------------------------------
pager:
  # Confidence threshold for auto-posting read-only analysis to Slack
  confidence-autopost-threshold: 0.75

  # Timeouts
  specialist-timeout-ms: 45000
  tool-call-timeout-ms: 15000

  # LLM model routing — pointing at Groq's models by default (PR #8)
  models:
    fast: ${PAGER_MODEL_FAST:llama-3.3-70b-versatile}
    quality: ${PAGER_MODEL_QUALITY:llama-3.3-70b-versatile}
    embed: ${PAGER_EMBED_MODEL:text-embedding-3-small}

  # Budget guard
  daily-budget-usd: ${PAGER_DAILY_BUDGET_USD:20.00}

  # Webhook security
  queue-name: pager.triage.queue
  pagerduty-webhook-secret: ${PAGER_PAGERDUTY_WEBHOOK_SECRET:dev-only-change-me}

  # LLM provider config (PR #8). Groq via its OpenAI-compatible API.
  llm:
    api-key: ${PAGER_GROQ_API_KEY:}
    base-url: ${PAGER_LLM_BASE_URL:https://api.groq.com/openai/v1}
    temperature: ${PAGER_LLM_TEMPERATURE:0.2}
    timeout-ms: ${PAGER_LLM_TIMEOUT_MS:30000}

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
logging:
  level:
    root: INFO
    dev.sumituppal.pager: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"